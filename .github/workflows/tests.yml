name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          # Laravel 11 no longer receives security fixes, so every 11.x release has open
          # advisories and Composer refuses to install it. Allow it here so we still verify
          # compatibility for users on Laravel 11.
          - laravel: '11.*'
            testbench: '9.*'
            allow-insecure: true
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Allow packages with security advisories
        if: matrix.allow-insecure
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest

  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      # Peck uses GNU Aspell for spell checking
      - name: Install Aspell
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: composer test:lint

      - name: Static analysis
        run: composer test:types

      - name: Refactor check
        run: composer test:refactor

      - name: Typos
        run: composer test:typos

      - name: Type coverage
        run: composer test:type-coverage

      - name: Tests with coverage
        run: composer test:unit
